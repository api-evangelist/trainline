  - id: trenitalia-rtvt
    field: trenitalia_rtvt_id
    authority: Trenitalia
    scope: Italy
  - id: trenord
    field: trenord_id
    authority: Trenord
    scope: Lombardy, Italy
  - id: ntv
    field: ntv_id
    enabled_field: ntv_is_enabled
    authority: NTV / Italo
    scope: Italy
  - id: ntv-rtiv
    field: ntv_rtiv_id
    authority: NTV / Italo
    scope: Italy
  - id: renfe
    field: renfe_id
    enabled_field: renfe_is_enabled
    authority: Renfe
    scope: Spain
  - id: cercanias
    field: cercanias_id
    enabled_field: cercanias_is_enabled
    hub_field: cercanias_hub_id
    authority: Renfe Cercanías
    scope: Spain (commuter)
  - id: entur
    field: entur_id
    enabled_field: entur_is_enabled
    authority: Entur
    scope: Norway
  - id: benerail
    field: benerail_id
    enabled_field: benerail_is_enabled
