note: >-
  Trainline publishes no machine-readable contract for the Global API — no OpenAPI, no Swagger,
  no GraphQL introspection surface, no AsyncAPI, no MCP server — so nothing below is derived from
  a specification. Every entry is either a claim Trainline itself publishes in prose, or an
  identifier/licence standard the ODbL stations dataset provably uses. Where a standard is not
  claimed and cannot be observed, conforms is false with evidence stating that, not an assumption
  of non-conformance in the product itself.
