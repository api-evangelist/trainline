name: Trainline
kind: company
description: >-
  Trainline plc is Europe's leading independent rail and coach ticket retailer and distribution
  platform, headquartered in London and listed on the London Stock Exchange, with the United Kingdom
  as its home market. It aggregates fares, inventory and real-time journey data from 270+ rail and
  coach carriers across more than 40 countries and resells that content through its own consumer app
  and website, through Trainline for Business, and — via Trainline Solutions / Trainline Partner
  Solutions — as wholesale distribution to other travel sellers through its Global API, Agent Tool
  and White Label products. In distribution terms Trainline is an aggregator-reseller sitting between
  the carriers and the traveller: rail has no GDS-equivalent oligopoly and no NDC, so Trainline is
  itself the intermediation layer, holding the carrier connections, the ticket-issuing accreditation
  and the settlement relationships that a competitor would otherwise have to rebuild carrier by
  carrier. Its API posture is honestly gated: the Global API is publicly described as "a modern,
  intuitive RESTful API" on tps.thetrainline.com but there is no developer portal, no public
  reference, no sandbox and no OpenAPI — access requires a commercial agreement reached through a
  sales conversation, and in Great Britain a retailer also needs Rail Delivery Group / Rail
  Settlement Plan third-party retailer accreditation and a bond. The one genuinely open artifact is
  the ODbL-licensed European station database Trainline publishes on GitHub, which maps its internal
  station ids to UIC codes, ATOC/CRS codes and carrier-specific ids.
