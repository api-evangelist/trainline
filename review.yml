aid: trainline
name: Trainline
review:
  question: Does Trainline publish a public, self-serve developer surface for its rail distribution API, and what would it cost a customer to leave?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  bootstrap: true
findings:
  summary: |
    Trainline plc (LSE-listed, London HQ, home market United Kingdom) is Europe's
    largest independent rail and coach retailer and, through Trainline Solutions /
    Trainline Partner Solutions (TPS), a wholesale distributor of rail content to
    other travel sellers. It publicly markets a "Global API" at
    https://tps.thetrainline.com/our-products/global-api/ (HTTP 200) and again at
    https://www.thetrainline.com/solutions/api (HTTP 200), but there is NO public
    developer portal, NO API reference, NO sandbox, NO published base URL, NO
    machine-readable specification and NO self-serve signup. Every documented
    onboarding path terminates in a sales conversation
    (https://tps.thetrainline.com/get-in-touch/, HTTP 200) or the corporate sales
    mailbox Corporate.Sales@thetrainline.com cited on the solutions page.
    The only real machine-consumable artifact Trainline publishes is open DATA, not
    an API: the ODbL-licensed European station database at
    https://github.com/trainline-eu/stations (HTTP 200, actively maintained,
    last commit 2026-07-27).
  developerPortal:
    url: https://tps.thetrainline.com/
    httpStatus: 200
    confirmed: false
    note: |
      tps.thetrainline.com is a marketing site for Trainline Partner Solutions, not a
      developer portal. It has no docs area, no console, no key issuance, no sandbox
      and no login. robots.txt is "Allow: /" and its declared sitemap
      (https://tps.thetrainline.com/xmlsitemap) returned no <loc> entries when parsed,
      so no hidden docs tree was discoverable.
