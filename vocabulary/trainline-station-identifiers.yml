license: ODbL-1.0
records: 71781
note: >-
  This is the identifier vocabulary of European rail and coach distribution as Trainline actually
  operates it. Rail has no GDS oligopoly and no NDC, so there is no industry-wide passenger-facing
  location registry; every carrier keeps its own station ids, and an aggregator's real asset is the
  crosswalk between them. Trainline publishes that crosswalk in the open under ODbL — the single
  most reusable machine-readable artifact it produces — even though its commercial Global API is
  entirely gated. Every term below is taken verbatim from a column that exists in stations.csv; none
  is inferred.
identifier_systems:
  - id: trainline-id
    field: id
    authority: Trainline
    scope: internal
    description: Trainline's own unique station identifier — the join key for every other system here.
  - id: trainline-urn
    field: normalised_code
    authority: Trainline
    scope: internal
    format: 'urn:trainline:public:nloc:<code>'
    description: Cross-source location identifier expressed as an RFC 8141 URN in a Trainline namespace.
  - id: trainline-slug
    field: slug
    authority: Trainline
    scope: internal
    description: URL-safe identifier used for suggestable stations.
  - id: uic
    field: uic
    authority: UIC — International Union of Railways
    scope: international
    description: The nearest thing European rail has to a universal station code (7 digits).
  - id: uic8-sncf
    field: uic8_sncf
    authority: SNCF
    scope: national
    description: SNCF's 8-digit UIC variant — the UIC code plus a checksum digit.
  - id: atoc-crs
    field: atoc_id
    enabled_field: atoc_is_enabled
    authority: ATOC / Rail Delivery Group
    scope: Great Britain
    description: The CRS/three-alpha station code that GB rail retailing runs on.
  - id: sncf
    field: sncf_id
    enabled_field: sncf_is_enabled
    authority: SNCF
    scope: France
  - id: sncf-tvs
    field: sncf_tvs_id
    authority: SNCF
    scope: France
    description: SNCF TVS (Thalys/ticketing) station identifier.
  - id: db
    field: db_id
    enabled_field: db_is_enabled
    authority: Deutsche Bahn
    scope: Germany
  - id: obb
    field: obb_id
    enabled_field: obb_is_enabled
    authority: ÖBB
    scope: Austria
  - id: cff
