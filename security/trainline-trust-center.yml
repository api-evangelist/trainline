note: >-
  Trainline runs no vendor trust portal (no trust.thetrainline.com, no Vanta/Drata/SafeBase
  page, no security.thetrainline.com). Its published trust surface is a single consumer-facing
  "Trainline Security Overview" page under the terms tree. It is unusually substantive for that
  format — it names certifications with certificate numbers, an uptime commitment, the hosting
  provider and data residency, and a vulnerability reporting address — so it is captured here as
  the trust-centre equivalent. There is no partner/API-specific trust pack published, and no
  downloadable evidence (no SOC 2 report, no ISO certificate PDF, no CAIQ/SIG, no subprocessor list).
