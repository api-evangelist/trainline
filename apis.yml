apis:
- aid: trainline:trainline-global-api
  name: Trainline Global API
  description: >-
    Trainline Partner Solutions' wholesale rail and coach distribution API, sold to travel sellers,
    OTAs, TMCs and corporate booking tools. Trainline publicly describes it as "a modern, intuitive
    RESTful API built on the most up to date tech stack" covering search and browse (quoted at "600
    searches per second"), booking and ticketing, payment in 10 currencies including on-account,
    real-time information on delays, disruption and platform changes, and aftersales — "cancellations
    within an hour, exchanges, changes of journey and refunds" — plus market-specific features such
    as UK SplitSave and seat maps, across ">44.8k stations connected". No public documentation, API
    reference, sandbox, machine-readable specification or self-serve signup is published; the only
    onboarding path is "Get in touch", with a stated average integration time of 12 weeks and
    Trainline-assisted carrier accreditation. No baseURL is recorded here because none is published;
    the host api.thetrainline.com resolves but returns HTTP 401 with a Basic auth challenge on every
    path and is not documented as the Global API endpoint.
  tags:
  - Rail
  - Booking
  - Ticketing
  - Distribution
  - Travel
