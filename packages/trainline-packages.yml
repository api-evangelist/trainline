api_clients:
  published: false
  note: >-
    Trainline ships NO client library, SDK or helper package for the Global API in any registry,
    in any language. This is consistent with the rest of its API posture: the Global API is sold
    under commercial agreement with a stated 12-week assisted integration, and whatever tooling
    partners receive is delivered privately after contract, not published. Searching npm for
    "trainline" returns only the first-party front-end/infrastructure packages below plus
    third-party community packages (trainline-stations by juliuste, uk-railway-stations by
    davwheat) that wrap the ODbL stations dataset — those are NOT Trainline packages and are not
    listed as such here.
