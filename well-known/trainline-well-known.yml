source: live probes of every Trainline host recorded in apis.yml
note: Trainline publishes no /.well-known/ discovery surface for its commercial Global API. api.thetrainline.com
  answers every path with HTTP 401 and a Basic auth challenge, so no anonymous discovery document is reachable
  there. The only /.well-known/ documents that return real JSON anywhere on a Trainline domain belong
  to the Umbraco CMS that runs the corporate site www.trainlinegroup.com (member authentication for gated
  investor/press content) — they are recorded here because they are genuinely published, NOT because they
  describe the Global API. The Umbraco Content Delivery API itself (/umbraco/delivery/api/v1/content)
  and its Swagger endpoints return the site's HTML 404 page, i.e. the content API is disabled.
hosts_probed:
