  - url: https://tps.thetrainline.com/partner-support/
    type: Support
    note: Onboarding and support model; 12-week integration; carrier accreditation support; no public docs URL.
  - url: https://www.thetrainline.com/solutions/api
    type: Documentation
    note: '"270 carriers. 45 countries."; contact route Corporate.Sales@thetrainline.com.'
  - url: https://tps.thetrainline.com/terms-and-conditions/
    type: TermsOfService
    note: Website-use policy only; no commercial or API terms.
  - url: https://www.thetrainline.com/terms/privacy
    type: PrivacyPolicy
    note: GDPR portability and access rights, exercised by email to DPO@thetrainline.com.
  - url: https://github.com/trainline-eu/stations
    type: GitHubRepository
    note: ODbL station database and identifier crosswalk (UIC, ATOC/CRS, per-carrier ids).
  - url: https://www.trainlinegroup.com/
    type: Website
    note: Corporate facts, divisions, scale.
