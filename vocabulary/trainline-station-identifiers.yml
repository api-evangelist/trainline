reference_standards:
  - {standard: 'ISO 3166-1 alpha-2', field: country, use: country of the station}
  - {standard: 'IANA tz database', field: time_zone, use: local time zone, example: Europe/Paris}
  - {standard: 'ISO 639-1', field: 'info:<lang>', use: 18 localised information columns}
  - {standard: 'WGS 84 decimal degrees', field: 'latitude, longitude', use: geolocation}
  - {standard: 'RFC 8141 URN', field: normalised_code, use: namespaced cross-source location id}
  - {standard: 'ODbL 1.0', field: null, use: licence of the whole dataset}
classification_flags:
  - {field: is_city, meaning: the row represents a city rather than one physical station}
  - {field: is_main_station, meaning: the station is the main station of its city}
  - {field: is_airport, meaning: the station serves an airport}
  - {field: is_suggestable, meaning: the station may be offered in search suggestions}
  - {field: country_hint, meaning: display the country alongside the name to disambiguate}
  - {field: main_station_hint, meaning: display main-station status alongside the name}
  - {field: sncf_self_service_machine, meaning: an SNCF self-service ticket machine is available}
graph_fields:
  - {field: parent_station_id, meaning: groups a station under a meta-station}
  - {field: hub_id, meaning: groups a station under a hub}
  - {field: same_as, meaning: points a duplicate row at its canonical station}
localisation_languages: [de, en, es, fr, it, nb, nl, cs, da, hu, ja, ko, pl, pt, ru, sv, tr, zh]
source_datasets:
  - OpenStreetMap
  - SNCF OpenData
  - GeoNames
  - Digitraffic.fi
  - OpenTransportData.swiss
  - admin.ch
downstream_reuse:
  - name: reStations
    url: https://github.com/mainmatter/reStations
    description: >-
      Third-party implementation of the OSDM API specification's Places API backed by this dataset.
      Not a Trainline project — evidence that the open station data, not the gated Global API, is
      what the ecosystem actually builds on.
  - name: trainline-stations (npm)
    url: https://www.npmjs.com/package/trainline-stations
    description: Third-party npm packaging of the dataset (author juliuste).
schema: json-schema/trainline-station.json
